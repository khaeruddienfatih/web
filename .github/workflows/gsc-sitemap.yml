name: Kirim sitemap haji.biz ke Search Console
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'   # tiap Senin 08:17 WIB
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - run: python3 tools/gsc_submit_sitemap.py
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
